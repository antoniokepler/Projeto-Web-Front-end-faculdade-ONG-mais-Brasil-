<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Mais Brasil - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">ONG Mais Brasil</a>
      <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html" class="active">Seja Voluntário</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-card">
      <h1>Cadastro de Colaborador</h1>
      <form id="cadForm">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>
            <span class="error-message" id="cpfError">CPF inválido.</span>
          </div>
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cep">CEP</label>
            <input type="text" id="cep" placeholder="00000-000" required>
          </div>
          <div class="form-group">
            <label for="uf">Estado (UF)</label>
            <input type="text" id="uf" required readonly>
          </div>
        </div>

        <div class="form-group">
          <label for="rua">Rua / Logradouro</label>
          <input type="text" id="rua" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" required>
          </div>
          <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" required readonly>
          </div>
        </div>

        <button type="submit">Finalizar Cadastro</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ONG Mais Brasil. Todos os direitos reservados.</p>
  </footer>

  <!-- Importação dos arquivos JS no final do body -->
  <script src="js/masks.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
